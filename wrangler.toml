# Cloudflare Pages project configuration.
#
# The site is a pure static build: no functions, no server, no environment variables.
# In the Pages dashboard, point the project at this repo with build command `npm run build`
# and output directory `dist`.
#
# SPA fallback lives in public/_redirects, which Cloudflare copies into dist/ — it is not
# expressible here.

name = "frontline-reference"
compatibility_date = "2026-11-01"

[build]
command = "npm run build"
cwd = "/"
